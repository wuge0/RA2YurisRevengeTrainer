name: Sync Upstream

on:
  schedule:
    # 每天北京时间 6:00 (UTC 22:00) 自动同步
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add upstream remote
      run: |
        git remote add upstream https://github.com/AdjWang/RA2YurisRevengeTrainer.git
        git fetch upstream

    - name: Sync with upstream
      run: |
        BRANCH=$(git branch --show-current)
        LOCAL=$(git rev-parse HEAD)
        UPSTREAM=$(git rev-parse upstream/main)

        if [ "$LOCAL" = "$UPSTREAM" ]; then
          echo "已经是最新，无需同步代码"
        else
          git merge upstream/main --allow-unrelated-histories --no-edit || {
            git merge --abort
            git reset --hard upstream/main
          }
          git push origin $BRANCH
          echo "代码同步完成"
        fi

    - name: Sync Release from upstream
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        UPSTREAM_REPO: AdjWang/RA2YurisRevengeTrainer
      run: |
        # 获取上游最新 Release 信息
        RELEASE_JSON=$(curl -sL \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest")
        
        TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
        NAME=$(echo "$RELEASE_JSON" | jq -r '.name')
        BODY=$(echo "$RELEASE_JSON" | jq -r '.body')
        PRERELEASE=$(echo "$RELEASE_JSON" | jq -r '.prerelease')
        ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[0].url')
        ASSET_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[0].name')
        
        echo "上游最新Release: $TAG / $NAME"
        echo "资产: $ASSET_NAME"

        # 下载上游资产
        curl -sL -o "/tmp/$ASSET_NAME" \
          -H "Accept: application/octet-stream" \
          "$ASSET_URL"
        echo "下载完成: $(ls -la /tmp/$ASSET_NAME)"

        # 删除本地同Tag旧Release
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

        # 创建新Release
        if [ "$PRERELEASE" = "true" ]; then
          gh release create "$TAG" "/tmp/$ASSET_NAME" --title "$NAME" --notes "$BODY" --prerelease
        else
          gh release create "$TAG" "/tmp/$ASSET_NAME" --title "$NAME" --notes "$BODY"
        fi
        
        echo "Release $TAG 创建完成"
